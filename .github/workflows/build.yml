name: Build Kirisakura Kernel (ReSukiSU)

on:
  workflow_dispatch:
    inputs:
      KERNEL_REPO:
        description: "Repo source kernel (fork kamu)"
        required: true
        default: "nevadamurdock/Kirisakura_ANAKIN_ROG5"
      KERNEL_BRANCH:
        description: "Branch kernel"
        required: true
        default: "master_release_t_1"
      DEFCONFIG:
        description: "Nama defconfig"
        required: true
        default: "kirisakura_defconfig"
      LOCALVERSION:
        description: "Suffix nama kernel (CONFIG_LOCALVERSION)"
        required: true
        default: "-GusKernel"
      KSU_MODE:
        description: "Mode integrasi ReSukiSU"
        required: true
        type: choice
        default: "manual_hook"
        options:
          - manual_hook   # Manual / Inline hook standar
          - susfs         # ReSukiSU + SUSFS 2.1.0 (Backport 5.4)
      PATCH_ZIP_URL:
        description: "URL Direct download patch backport SUSFS"
        required: false
        default: "https://uploader.sh/q0jRs/mbut.zip"
      CLANG_TAG:
        description: "Tag prebuilt Clang AOSP"
        required: true
        default: "clang-r450784d"

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  KBUILD_BUILD_USER: "GusKernel"
  KBUILD_BUILD_HOST: "github-actions"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # ------------------------------------------------------------------
      # 1. Checkout Kernel Source
      # ------------------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.KERNEL_REPO }}
          ref: ${{ github.event.inputs.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      # ------------------------------------------------------------------
      # 2. Install Build Dependencies
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential kmod cpio rsync \
            python3 python3-pip git curl zip unzip \
            device-tree-compiler

      # ------------------------------------------------------------------
      # 3. Fetch Toolchains (Clang & GCC)
      # ------------------------------------------------------------------
      - name: Fetch Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain/clang
          git clone --depth 1 https://git.code.sf.net/p/clang-r450784d/code $GITHUB_WORKSPACE/toolchain/clang/clang-src
          echo "CLANG_DIR=$GITHUB_WORKSPACE/toolchain/clang/clang-src" >> "$GITHUB_ENV"

      - name: Fetch GCC Toolchains
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain/gcc
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git $GITHUB_WORKSPACE/toolchain/gcc/aarch64
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git $GITHUB_WORKSPACE/toolchain/gcc/arm

          echo "GCC64_DIR=$GITHUB_WORKSPACE/toolchain/gcc/aarch64" >> "$GITHUB_ENV"
          echo "GCC32_DIR=$GITHUB_WORKSPACE/toolchain/gcc/arm" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 4. Integrasi ReSukiSU Base
      # ------------------------------------------------------------------
      - name: Setup ReSukiSU
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      # ------------------------------------------------------------------
      # 5. MODE A: Manual Hook (Inline Hook Auto-Fix)
      # ------------------------------------------------------------------
      - name: Auto-patch ReSukiSU Manual Hooks
        if: ${{ github.event.inputs.KSU_MODE == 'manual_hook' }}
        working-directory: kernel
        run: |
          python3 -c '
          import os

          # 1. Patch fs/exec.c
          exec_path = "fs/exec.c"
          if os.path.exists(exec_path):
              with open(exec_path, "r") as f:
                  code = f.read()
              if "ksu_handle_execveat" not in code:
                  target = "static int do_execveat_common"
                  idx = code.find(target)
                  if idx != -1:
                      brace_idx = code.find("{", idx)
                      if brace_idx != -1:
                          dec = "\n#ifdef CONFIG_KSU\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, struct user_arg_ptr *argv, struct user_arg_ptr *envp, int *flags);\n#endif\n"
                          call = "\n    #ifdef CONFIG_KSU\n    ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n    #endif\n"
                          code = code[:idx] + dec + code[idx:brace_idx+1] + call + code[brace_idx+1:]
                          with open(exec_path, "w") as f:
                              f.write(code)

          # 2. Patch fs/open.c
          open_path = "fs/open.c"
          if os.path.exists(open_path):
              with open(open_path, "r") as f:
                  code = f.read()
              if "ksu_handle_faccessat" not in code:
                  target = "long do_faccessat"
                  if target not in code:
                      target = "SYSCALL_DEFINE3(faccessat"
                  idx = code.find(target)
                  if idx != -1:
                      brace_idx = code.find("{", idx)
                      if brace_idx != -1:
                          dec = "\n#ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n"
                          call = "\n    #ifdef CONFIG_KSU\n    ksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n    #endif\n"
                          code = code[:idx] + dec + code[idx:brace_idx+1] + call + code[brace_idx+1:]
                          with open(open_path, "w") as f:
                              f.write(code)

          # 3. Patch fs/stat.c (Fix C99 & Variable Types)
          stat_path = "fs/stat.c"
          if os.path.exists(stat_path):
              with open(stat_path, "r") as f:
                  code = f.read()
              if "ksu_handle_stat" not in code:
                  target = "int vfs_statx"
                  if target not in code:
                      target = "vfs_fstatat"
                  idx = code.find(target)
                  if idx != -1:
                      brace_idx = code.find("{", idx)
                      if brace_idx != -1:
                          dec = "\n#ifdef CONFIG_KSU\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif\n"
                          call = "\n    #ifdef CONFIG_KSU\n    ksu_handle_stat(&dfd, &filename, &flags);\n    #endif\n"
                          code = code[:idx] + dec + code[idx:brace_idx+1] + call + code[brace_idx+1:]
                          with open(stat_path, "w") as f:
                              f.write(code)

          # 4. Patch kernel/reboot.c
          reboot_path = "kernel/reboot.c"
          if os.path.exists(reboot_path):
              with open(reboot_path, "r") as f:
                  code = f.read()
              if "ksu_handle_sys_reboot" not in code:
                  target = "SYSCALL_DEFINE4(reboot"
                  if target not in code:
                      target = "kernel_restart"
                  idx = code.find(target)
                  if idx != -1:
                      brace_idx = code.find("{", idx)
                      if brace_idx != -1:
                          dec = "\n#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int *magic1, int *magic2, unsigned int *cmd, void __user **arg);\n#endif\n"
                          call = "\n    #ifdef CONFIG_KSU\n    ksu_handle_sys_reboot(&magic1, &magic2, &cmd, &arg);\n    #endif\n"
                          code = code[:idx] + dec + code[idx:brace_idx+1] + call + code[brace_idx+1:]
                          with open(reboot_path, "w") as f:
                              f.write(code)
          '

      # ------------------------------------------------------------------
      # 6. MODE B: SUSFS v2.2.0 Patching (Clean Directory Targeting)
      # ------------------------------------------------------------------
      - name: Apply SUSFS Patch (Original 5.4 + Backport v2.2.0)
        if: ${{ github.event.inputs.KSU_MODE == 'susfs' }}
        working-directory: kernel
        run: |
          echo "⬇️ 1. Cloning Official SUSFS 5.4 Repo for Base Hooks..."
          git clone --depth 1 -b kernel-5.4 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs_official

          echo "🛠️ 2. Applying Original Kernel 5.4 Base Hooks (Core Kernel)..."
          if [ -f "../susfs_official/kernel_patches/50_add_susfs_in_kernel-5.4.patch" ]; then
            patch -p1 --ignore-whitespace -N -s < ../susfs_official/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true
          fi

          echo "⬇️ 3. Downloading SUSFS v2.2.0 Package..."
          curl -sL "${{ github.event.inputs.PATCH_ZIP_URL }}" -o susfs_pack.zip
          unzip -q susfs_pack.zip -d susfs_tmp/

          echo "📂 4. Copying SUSFS v2.2.0 Source Files..."
          cp -rf susfs_tmp/fs/* ./fs/ || true
          cp -rf susfs_tmp/include/linux/* ./include/linux/ || true

          echo "🛠️ 5. Applying SUSFS v2.2.0 Core Kernel Patch..."
          if [ -f "susfs_tmp/50_add_susfs_2.2.0_in_kernel-5.4.patch" ]; then
            patch -p1 --ignore-whitespace -N -s < susfs_tmp/50_add_susfs_2.2.0_in_kernel-5.4.patch || true
          fi

          echo "🛠️ 6. Patching ReSukiSU Driver Specifically..."
          # Deteksi lokasi lokasi folder ReSukiSU/KernelSU
          KSU_DIR=""
          if [ -d "KernelSU" ]; then
            KSU_DIR="KernelSU"
          elif [ -d "drivers/kernelsu" ]; then
            KSU_DIR="drivers/kernelsu"
          fi

          PATCH_KSU="$(pwd)/susfs_tmp/KernelSU_patches/10_enable_susfs_for_ksu.patch"

          if [ -n "$KSU_DIR" ] && [ -f "$PATCH_KSU" ]; then
            echo "Applying $PATCH_KSU inside $KSU_DIR..."
            cd "$KSU_DIR"
            # Eksekusi patch langsung DARI DALAM folder ReSukiSU
            patch -p1 --ignore-whitespace -N < "$PATCH_KSU" || \
            patch -p0 --ignore-whitespace -N < "$PATCH_KSU" || true
            cd ..
          fi

          echo "🛠️ 7. Wiring Up Build System (fs/Makefile & fs/Kconfig)..."
          if ! grep -q "obj-\$(CONFIG_SUSFS)" fs/Makefile; then
            echo 'obj-$(CONFIG_SUSFS) += susfs.o' >> fs/Makefile
          fi
          if ! grep -q 'source "fs/susfs_Kconfig"' fs/Kconfig; then
            sed -i '/endmenu/i source "fs/susfs_Kconfig"' fs/Kconfig
          fi

          rm -rf susfs_tmp susfs_pack.zip ../susfs_official

      # ------------------------------------------------------------------
      # 7. WireGuard Integration Fix
      # ------------------------------------------------------------------
      - name: Setup WireGuard source
        working-directory: kernel
        run: |
          if [ ! -d "net/wireguard" ] || [ ! -f "net/wireguard/Kconfig" ]; then
            rm -rf net/wireguard
            git clone --depth 1 https://git.zx2c4.com/wireguard-linux-compat net/wireguard_tmp
            mv net/wireguard_tmp/src net/wireguard
            rm -rf net/wireguard_tmp
          fi    

      # ------------------------------------------------------------------
      # 8. Configure Defconfig
      # ------------------------------------------------------------------
      - name: Patch Defconfig
        working-directory: kernel
        run: |
          DEFCONFIG_PATH="arch/arm64/configs/${{ github.event.inputs.DEFCONFIG }}"

          # Set CONFIG_LOCALVERSION
          if grep -q "^CONFIG_LOCALVERSION=" "$DEFCONFIG_PATH"; then
            sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"${{ github.event.inputs.LOCALVERSION }}\"|" "$DEFCONFIG_PATH"
          else
            echo "CONFIG_LOCALVERSION=\"${{ github.event.inputs.LOCALVERSION }}\"" >> "$DEFCONFIG_PATH"
          fi

          sed -i "s|^CONFIG_LOCALVERSION_AUTO=.*|CONFIG_LOCALVERSION_AUTO=n|" "$DEFCONFIG_PATH" || echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFCONFIG_PATH"

          # KSU Configurations
          echo "" >> "$DEFCONFIG_PATH"
          echo "# ReSukiSU Configuration" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG_PATH"

          if [ "${{ github.event.inputs.KSU_MODE }}" = "susfs" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_SUSFS=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_SUSFS_SUS_OVERLAYFS=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_SUSFS_TRY_UMOUNT=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_SUSFS_SPOOF_UNAME_RELEASE=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_SUSFS_ENABLE_LOG=y" >> "$DEFCONFIG_PATH"
          else
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG_PATH"
          fi

      # ------------------------------------------------------------------
      # 9. Execute Compilation
      # ------------------------------------------------------------------
      - name: Build Kernel
        working-directory: kernel
        run: |
          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KCFLAGS="-O3"

          LLVM_FLAGS="CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"

          # Make Defconfig
          make O=${OUT_DIR} ARCH=${ARCH} \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} \
            CLANG_TRIPLE=${CLANG_TRIPLE} \
            ${LLVM_FLAGS} \
            "${{ github.event.inputs.DEFCONFIG }}"

          # Make Kernel Image
          make -j$(nproc --all) O=${OUT_DIR} ARCH=${ARCH} \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} \
            CLANG_TRIPLE=${CLANG_TRIPLE} \
            ${LLVM_FLAGS} \
            KCFLAGS="${KCFLAGS}" 2>&1 | tee $GITHUB_WORKSPACE/build.log

      # ------------------------------------------------------------------
      # 10. Collect & Upload Artifacts
      # ------------------------------------------------------------------
      - name: Collect build output
        run: |
          mkdir -p output
          for f in kernel/${OUT_DIR}/arch/arm64/boot/Image \
                   kernel/${OUT_DIR}/arch/arm64/boot/Image.gz \
                   kernel/${OUT_DIR}/arch/arm64/boot/Image.gz-dtb \
                   kernel/${OUT_DIR}/arch/arm64/boot/dtb.img; do
            [ -f "$f" ] && cp "$f" output/ || true
          done

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GusKernel-${{ github.event.inputs.KSU_MODE }}-${{ github.run_number }}
          path: output/*

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Full-Kernel-Build-Log
          path: ${{ github.workspace }}/build.log
